# Weekly pull requests for outdated or vulnerable dependencies.
# Each update arrives as a normal PR, so CI tests it before anyone merges it.
version: 2
updates:
  - package-ecosystem: uv            # pyproject.toml + uv.lock
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions  # the pinned action SHAs in .github/workflows
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker          # base images in the Dockerfile
    directory: /
    schedule:
      interval: weekly
