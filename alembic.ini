# Alembic configuration.
#
# There is deliberately NO database URL here: migrations/env.py builds it from
# app Settings (NEXUS_POSTGRES_* env vars), so credentials live in one place
# and never in a committed file.
#
#   uv run alembic upgrade head                     apply all migrations
#   uv run alembic downgrade -1                     undo the latest migration
#   uv run alembic revision --autogenerate -m "…"   draft a migration from model changes
#   uv run alembic history                          list migrations

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Files sort by creation date: 20261121_1530_<rev>_create_tenants.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC

[post_write_hooks]
# Format generated migrations with the project's ruff config.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
