# Local development stack.
#
#   docker compose up -d --build     start everything (API on http://localhost:8000)
#   docker compose ps                status + health
#   docker compose logs -f api       follow API logs
#   docker compose down              stop (data volumes are kept)
#   docker compose down -v           stop and DELETE all local data
#
# Credentials below are LOCAL-ONLY defaults for throwaway containers. They are
# not secrets. Override any of them from your shell, e.g.
#   POSTGRES_PASSWORD=something docker compose up -d
# Real environments get credentials from AWS Secrets Manager (Phase 8).
#
# Every port is bound to 127.0.0.1, so databases are reachable from this
# machine only, never from the local network.

name: nexus-rag

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/; mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.3-alpine
    # Broker settings from ADR-0002: AOF persistence (queued tasks survive a
    # restart) and noeviction (never silently drop tasks when memory is full).
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.20.2
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"  # REST
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"  # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image has neither curl nor wget, so speak HTTP over bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for local development (ADR-0005).
  # SeaweedFS replaces MinIO, whose community images are no longer published.
  object-store:
    image: chrislusf/seaweedfs:4.54
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    environment:
      # SeaweedFS turns these into the S3 identity; requests signed with
      # anything else get SignatureDoesNotMatch, and anonymous requests get 403.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-nexus-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-nexus-local-only-secret}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - object-store-data:/data
    healthcheck:
      # Any HTTP answer (403 for an unsigned request) means the S3 API is up.
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: nexus-rag:local
    env_file:
      - path: .env
        required: false  # works before you've created .env
    environment:
      NEXUS_LOG_FORMAT: json
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      object-store:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  object-store-data:
